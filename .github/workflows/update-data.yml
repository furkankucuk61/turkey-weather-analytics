name: Daily Weather Data Update

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Fetch weather and air quality data
        run: python src/main.py

      - name: Clean data
        run: python src/data_cleaning.py

      - name: Analyze data
        run: python src/data_analysis.py

      - name: Generate visualizations
        run: python src/visualization.py

      - name: Commit and push updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/raw/ data/processed/ reports/

          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "Automated daily weather and air quality update"
            git push
          fi